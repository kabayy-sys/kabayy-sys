name: Update stats card

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_stats.py"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1) ENGINE — lowlighter/metrics collects the data (JSON dump, no rendering).
      #    Needs a Personal Access Token in secret METRICS_TOKEN (GITHUB_TOKEN is not accepted).
      - name: Collect data (lowlighter/metrics)
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kabayy-sys
          filename: metrics.json
          config_output: json
          output_action: none
          plugin_languages: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Locate metrics.json
        run: |
          f=$(find /metrics_renders /rendered "$GITHUB_WORKSPACE" -maxdepth 3 -name 'metrics.json' 2>/dev/null | head -n1 || true)
          if [ -n "$f" ]; then cp "$f" ./metrics.json && echo "found: $f"; else echo "metrics.json not found (API fallback will be used)"; fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 2) DESIGN — our own renderer turns the data into assets/stats.svg
      - name: Render stats card
        run: python scripts/generate_stats.py
        env:
          GH_USER: kabayy-sys
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          METRICS_JSON: metrics.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git diff --cached --quiet || (git commit -m "chore: update stats card" && git push)
