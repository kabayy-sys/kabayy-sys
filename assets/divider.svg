<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 30" width="900" height="30" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4AF6A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#D4AF6A"/>
      <stop offset="1" stop-color="#D4AF6A" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <path d="M60 15H840" stroke="url(#line)" stroke-width="1"/>

  <!-- small side diamonds -->
  <polygon points="400,15 405,10 410,15 405,20" fill="none" stroke="#7A1B2E" stroke-width="1.2"/>
  <polygon points="490,15 495,10 500,15 495,20" fill="none" stroke="#7A1B2E" stroke-width="1.2"/>

  <!-- center diamond -->
  <polygon points="450,5 460,15 450,25 440,15" fill="#0B0B0F" stroke="#D4AF6A" stroke-width="1.5" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite"/>
  </polygon>
  <polygon points="450,10 455,15 450,20 445,15" fill="#C0314F">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </polygon>

  <!-- moving glint -->
  <circle cy="15" r="2" fill="#F3DDA6" filter="url(#glow)">
    <animate attributeName="cx" values="60;840;60" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0;1;0" dur="8s" repeatCount="indefinite"/>
  </circle>
</svg>
