<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Raken Rizki Saputra" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B0F"/>
      <stop offset="1" stop-color="#190810"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8924A"/>
      <stop offset="0.5" stop-color="#F3DDA6"/>
      <stop offset="1" stop-color="#B8924A"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C0314F" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C0314F"/>
      <stop offset="1" stop-color="#C0314F" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="320" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.025">
    <path d="M0 80H900M0 160H900M0 240H900M150 0V320M300 0V320M450 0V320M600 0V320M750 0V320"/>
  </g>

  <!-- left resonance rings -->
  <g transform="translate(110 150)" opacity="0.55">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
      <circle r="88" fill="none" stroke="#D4AF6A" stroke-width="1" stroke-dasharray="3 9"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="28s" repeatCount="indefinite"/>
      <polygon points="55,0 27.5,47.6 -27.5,47.6 -55,0 -27.5,-47.6 27.5,-47.6" fill="none" stroke="#C0314F" stroke-width="1.5"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      <polygon points="0,-70 70,0 0,70 -70,0" fill="none" stroke="#D4AF6A" stroke-width="1"/>
    </g>
    <polygon points="0,-12 12,0 0,12 -12,0" fill="#D4AF6A" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- right resonance rings -->
  <g transform="translate(790 150)" opacity="0.55">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="40s" repeatCount="indefinite"/>
      <circle r="88" fill="none" stroke="#D4AF6A" stroke-width="1" stroke-dasharray="3 9"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
      <polygon points="55,0 27.5,47.6 -27.5,47.6 -55,0 -27.5,-47.6 27.5,-47.6" fill="none" stroke="#C0314F" stroke-width="1.5"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
      <polygon points="0,-70 70,0 0,70 -70,0" fill="none" stroke="#D4AF6A" stroke-width="1"/>
    </g>
    <polygon points="0,-12 12,0 0,12 -12,0" fill="#D4AF6A" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- top label -->
  <text x="450" y="62" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" letter-spacing="7" fill="#C0314F">
    RESONATOR PROFILE
    <animate attributeName="opacity" values="1;0.45;1" dur="4s" repeatCount="indefinite"/>
  </text>
  <path d="M330 74H570" stroke="url(#fade)" stroke-width="1"/>

  <!-- name -->
  <text x="450" y="146" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" letter-spacing="9" fill="url(#gold)" filter="url(#glow)">
    RAKEN RIZKI SAPUTRA
  </text>

  <!-- subtitle -->
  <text x="450" y="186" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" letter-spacing="6" fill="#B9B9C6">
    BUILDER  ◆  SECURITY-MINDED  ◆  SYSTEMS THINKER
  </text>

  <!-- waveforms -->
  <path fill="none" stroke="#7A1B2E" stroke-width="2" opacity="0.8"
        d="M0 258 Q56 228 112 258 T225 258 T337 258 T450 258 T562 258 T675 258 T787 258 T900 258">
    <animate attributeName="d" dur="5s" repeatCount="indefinite"
      values="M0 258 Q56 228 112 258 T225 258 T337 258 T450 258 T562 258 T675 258 T787 258 T900 258;
              M0 258 Q56 288 112 258 T225 258 T337 258 T450 258 T562 258 T675 258 T787 258 T900 258;
              M0 258 Q56 228 112 258 T225 258 T337 258 T450 258 T562 258 T675 258 T787 258 T900 258"/>
  </path>
  <path fill="none" stroke="#D4AF6A" stroke-width="1.2" opacity="0.7" filter="url(#glow)"
        d="M0 258 Q75 238 150 258 T300 258 T450 258 T600 258 T750 258 T900 258">
    <animate attributeName="d" dur="3.5s" repeatCount="indefinite"
      values="M0 258 Q75 238 150 258 T300 258 T450 258 T600 258 T750 258 T900 258;
              M0 258 Q75 278 150 258 T300 258 T450 258 T600 258 T750 258 T900 258;
              M0 258 Q75 238 150 258 T300 258 T450 258 T600 258 T750 258 T900 258"/>
  </path>

  <!-- floating particles -->
  <g fill="#D4AF6A">
    <circle cx="230" cy="230" r="1.6"><animate attributeName="cy" values="240;90;240" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="250" r="1.2"><animate attributeName="cy" values="250;110;250" dur="11s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="240" r="1.5"><animate attributeName="cy" values="240;100;240" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="670" cy="250" r="1.3"><animate attributeName="cy" values="250;95;250" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="10s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#C0314F">
    <circle cx="450" cy="245" r="1.6"><animate attributeName="cy" values="245;120;245" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="250" r="1.2"><animate attributeName="cy" values="250;130;250" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="12s" repeatCount="indefinite"/></circle>
  </g>

  <!-- corner brackets -->
  <g fill="none" stroke="#D4AF6A" stroke-width="1.5">
    <animate attributeName="opacity" values="1;0.4;1" dur="5s" repeatCount="indefinite"/>
    <path d="M16 46V16H46"/>
    <path d="M854 16H884V46"/>
    <path d="M16 274V304H46"/>
    <path d="M854 304H884V274"/>
  </g>
</svg>
